<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Bird Body -->
  <circle cx="48" cy="50" r="32" fill="url(#birdGrad)" stroke="#713f12" stroke-width="4.5" filter="url(#shadow)" />

  <!-- Belly highlight -->
  <path d="M 28 60 A 24 24 0 0 0 68 62 A 28 28 0 0 1 28 60 Z" fill="#ca8a04" opacity="0.3" />

  <!-- Beak -->
  <path d="M 66 44 L 88 52 L 66 60 Z" fill="url(#beakGrad)" stroke="#713f12" stroke-width="4" stroke-linejoin="round" />
  <line x1="68" y1="52" x2="84" y2="52" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eye -->
  <circle cx="58" cy="38" r="10" fill="#ffffff" stroke="#713f12" stroke-width="4" />
  <circle cx="61" cy="38" r="4.5" fill="#0f172a" />
  <circle cx="63" cy="36" r="1.5" fill="#ffffff" />

  <!-- Cheek blush -->
  <ellipse cx="50" cy="54" rx="5" ry="3.5" fill="#f87171" opacity="0.6" />

  <!-- Wing -->
  <path d="M 22 46 C 20 58 34 68 46 58 C 48 50 36 42 22 46 Z" fill="url(#wingGrad)" stroke="#713f12" stroke-width="4" stroke-linejoin="round" />
  <path d="M 27 50 C 29 55 37 57 41 53" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" />
</svg>

